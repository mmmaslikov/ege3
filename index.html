    <p>Используя информацию из приведённой базы данных, определите, на сколько единиц увеличилось количество упаковок йогурта питьевого с ягодными наполнителями (черника, малина, клубника) жирностью 1,5%, имеющихся в магазинах Нагорного района, за период с 1 по 15 октября включительно.</p>
    <p>В ответе запишите только число.</p>
    
    <a href="https://inf-ege.sdamgia.ru/get_file?id=228481" target="_blank" class="file-link">📥 Скачать файл задания</a>

    <h3>Решение</h3>
    <p>Открыв файл, перейдём на лист «Торговля». Озаглавим столбец G «Район», столбец H — «Товар».</p>
    <p>В ячейке G2 введем формулу <span class="formula">=ВПР(C2;Магазин!A:C;2;0)</span> и скопируем формулу до конца списка.</p>
    <p>В ячейке H2 введем формулу <span class="formula">=ВПР(D2;Товар!A:F;3;0)</span> и скопируем формулу до конца списка.</p>
    
    <div class="solution-image">
      <img src="images/0_2_2.png" alt="Единая таблица">
    </div>
    
    <p>Воспользуемся стандартными средствами редактора Microsoft Excel: требуется отфильтровать записи в таблице, оставив только записи для товара «йогурт питьевой с ягодными наполнителями (черника, малина, клубника) жирностью 1,5%», дата — с 1 по 15 октября, район «Нагорный».</p>
    <p>Для этого включим фильтр для столбцов от A до H:</p>
    
    <div class="solution-image">
      <img src="images/0_2_3.png" alt="Фильтр">
    </div>
    
    <p>Скопируем получившуюся таблицу на новый лист и отсортируем ее по столбцу «Тип операции».</p>
    
    <p>В ячейке J2 посчитаем на сколько увеличилось количество упаковок йогурта питьевого с ягодными наполнителями (черника, малина, клубника) жирностью 1,5%, имеющихся в магазинах Нагорного района, за период с 1 по 15 октября включительно, для этого введем формулу:</p>
    <div class="formula-box"><span class="formula">=СУММ(E2:E46)-СУММ(E47:E76)</span></div>
    
    <p>Всего на 6146 упаковок увеличилось количество упаковок йогурта питьевого с ягодными наполнителями (черника, малина, клубника) жирностью 1,5%, имеющихся в магазинах Нагорного района, за период с 1 по 15 октября включительно.</p>
    
    <div class="note note-success">
      <strong>Ответ: 6146</strong>
    </div>
  `;
  app.appendChild(example2);

  const mistakes = document.createElement('section');
  mistakes.className = 'card';
  mistakes.innerHTML = `
    <h2 class="card-title">Типичные ошибки</h2>
    <ul>
      <li>❌ Забывать указать 0 (ноль) в последнем аргументе ВПР — без него функция может вернуть неверный результат</li>
      <li>❌ Не учитывать тип операции (Поступление/Продажа) при фильтрации</li>
      <li>❌ Путать столбцы при копировании формул ВПР</li>
      <li>❌ Забывать про период дат, указанный в условии</li>
      <li>❌ Не проверять единицы измерения (кг, литры, упаковки) — иногда нужно делить или умножать на коэффициент</li>
    </ul>
    <div class="note">
      <strong>Совет:</strong> всегда начинайте с изучения схемы базы данных — это поможет понять, какие таблицы нужно связать.
    </div>
  `;
  app.appendChild(mistakes);
}

function renderPractice1() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">⚡ Практика 1</h2>
      <p class="section-desc">10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.</p>
    </div>
  `;
  app.appendChild(head);

  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice1-tasks';
  app.appendChild(tasksBlock);

  TASKS.slice(2, 12).forEach((task, idx) => {
    const taskEl = createTaskElement(task, idx + 1, 'practice1');
    tasksBlock.appendChild(taskEl);
  });
}

function renderPractice2() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title"> Практика 2</h2>
      <p class="section-desc">10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.</p>
    </div>
  `;
  app.appendChild(head);

  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice2-tasks';
  app.appendChild(tasksBlock);

  TASKS.slice(12, 22).forEach((task, idx) => {
    const taskEl = createTaskElement(task, idx + 1, 'practice2');
    tasksBlock.appendChild(taskEl);
  });

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary btn-block';
  checkBtn.textContent = '✓ Проверить все ответы';
  checkBtn.style.marginTop = '8px';
  checkBtn.addEventListener('click', checkAllPractice2);
  app.appendChild(checkBtn);

  const resultsPanel = document.createElement('div');
  resultsPanel.className = 'results-panel';
  resultsPanel.id = 'results-panel-2';
  app.appendChild(resultsPanel);
}

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';

  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.innerHTML = 'Задание ' + num + ' №' + task.num;
  header.appendChild(numEl);

  const linkEl = document.createElement('a');
  linkEl.className = 'task-link';
  linkEl.href = 'https://inf-ege.sdamgia.ru/problem?id=' + task.num;
  linkEl.target = '_blank';
  linkEl.rel = 'noopener';
  linkEl.textContent = 'Оригинал ↗';
  header.appendChild(linkEl);

  taskEl.appendChild(header);

  const textEl = document.createElement('p');
  textEl.className = 'task-text';
  textEl.innerHTML = task.text.replace(/\n/g, '<br>');
  taskEl.appendChild(textEl);

  // Выводим блоки таблиц по порядку (текст + заголовок таблицы)
  if (task.tableBlocks) {
    task.tableBlocks.forEach(block => {
      if (block.text) {
        const t = document.createElement('p');
        t.className = 'task-text';
        t.innerHTML = block.text.replace(/\n/g, '<br>');
        taskEl.appendChild(t);
      }
      const tableHeadersDiv = document.createElement('div');
      tableHeadersDiv.className = 'table-headers';
      const box = document.createElement('div');
      box.className = 'table-header-box';
      const title = document.createElement('div');
      title.className = 'table-title';
      title.textContent = block.title;
      box.appendChild(title);
      const cols = document.createElement('div');
      cols.className = 'table-cols';
      block.cols.forEach(c => {
        const col = document.createElement('span');
        col.className = 'table-col';
        col.textContent = c;
        cols.appendChild(col);
      });
      box.appendChild(cols);
      tableHeadersDiv.appendChild(box);
      taskEl.appendChild(tableHeadersDiv);
    });
  }

  // Текст перед схемой (schemaText)
  if (task.schemaText) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.innerHTML = task.schemaText.replace(/\n/g, '<br>');
    taskEl.appendChild(t);
  }

  // Схема базы данных
  if (task.schemaImage) {
    const imgDiv = document.createElement('div');
    imgDiv.className = 'task-image';
    const img = document.createElement('img');
    img.src = task.schemaImage;
    img.alt = 'Схема базы данных для задания ' + num;
    img.onerror = function() {
      this.style.display = 'none';
      const err = document.createElement('p');
      err.style.cssText = 'color:var(--text-muted);font-size:13px;text-align:center;';
      err.textContent = 'Изображение схемы не загружено. Поместите файл ' + task.schemaImage.split('/').pop() + ' в папку images/';
      this.parentElement.appendChild(err);
    };
    imgDiv.appendChild(img);
    taskEl.appendChild(imgDiv);
  }

  // Вопрос задания
  if (task.question) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.innerHTML = task.question.replace(/\n/g, '<br>');
    taskEl.appendChild(t);
  }

  // Примечание к ответу
  if (task.answerNote) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.innerHTML = task.answerNote.replace(/\n/g, '<br>');
    taskEl.appendChild(t);
  }

  // Ссылка на файл
  if (task.fileLink) {
    const fileLink = document.createElement('a');
    fileLink.className = 'file-link';
    fileLink.href = task.fileLink;
    fileLink.target = '_blank';
    fileLink.rel = 'noopener';
    fileLink.textContent = '📥 Скачать файл задания';
    taskEl.appendChild(fileLink);
  }

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';

  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ:';
  inputGroup.appendChild(label);

  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('data-lpignore', 'true');
  input.placeholder = 'Введите ответ';
  input.addEventListener('input', (e) => {
    updateAnswer(mode, task.id, e.target.value);
  });
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);

    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }

  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);

  // Разбиваем решение на абзацы по \n\n
  const solParagraphs = task.solution.split('\n\n');
  solParagraphs.forEach(para => {
    const trimmed = para.trim();
    if (trimmed) {
      const p = document.createElement('p');
      p.innerHTML = trimmed;
      solution.appendChild(p);
    }
  });

  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  taskEl.appendChild(solution);

  return taskEl;
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.checked1[taskId] = false;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;

  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;

  const userAnswer = (state.answers1[taskId] || '').trim();

  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }

  state.checked1[taskId] = true;

  if (userAnswer === task.answer) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) {
    sol.classList.toggle('show', state.showSolution1[taskId]);
  }
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;

  TASKS.slice(12, 22).forEach((task, idx) => {
    const num = idx + 1;
    const userAnswer = (state.answers2[task.id] || '').trim();
    const isCorrect = userAnswer === task.answer;
    if (isCorrect) correct++;
    results.push({
      num: num,
      task: task,
      userAnswer: userAnswer || '—',
      correctAnswer: task.answer,
      isCorrect: isCorrect
    });
  });

  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;

  panel.innerHTML = '';
  panel.classList.add('show');

  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);

  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);

  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');

    const head = document.createElement('div');
    head.className = 'result-item-head';

    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);

    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);

    item.appendChild(head);

    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.correctAnswer);
    item.appendChild(answers);

    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.className = 'result-item-solution';
      
      const solParagraphs = r.task.solution.split('\n\n');
      solParagraphs.forEach(para => {
        const trimmed = para.trim();
        if (trimmed) {
          const p = document.createElement('p');
          p.innerHTML = trimmed;
          sol.appendChild(p);
        }
      });
      
      item.appendChild(sol);
    }

    panel.appendChild(item);
  });

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;

  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  renderTheory();
}

init();
</script>
